[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Base mainnet / Base Sepolia are standard EVM; no special evm_version needed.
evm_version = "cancun"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

# RPC endpoints are read from env; never commit keys.
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
