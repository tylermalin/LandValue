name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install only what the tests exercise. The engine imports geopandas /
      # shapely / apify / pdfkit lazily (or uses pure-Python fallbacks), so the
      # suite runs without the heavy GDAL stack.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jinja2 python-dotenv pandas streamlit pydeck eth-utils

      - name: Run pytest
        run: pytest -q

  solidity:
    name: solidity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onchain
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install contract dependencies
        run: forge install foundry-rs/forge-std openzeppelin/openzeppelin-contracts --no-git

      - name: Run forge tests
        run: forge test -vvv
